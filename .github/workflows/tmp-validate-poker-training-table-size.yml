name: Validate poker training table size fix

on:
  push:
    branches:
      - fix/poker-training-table-size

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/poker-training-table-size
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run format:check
      - run: bun run docs
      - run: bun run changeset:status
      - name: Remove temporary validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-validate-poker-training-table-size.yml
          git commit -m "chore: complete poker table size validation"
          git push origin HEAD:fix/poker-training-table-size
